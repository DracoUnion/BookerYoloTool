[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-tool"
version = "1.0.0"
description = "YOLO 综合工具 - PyQt6 rewrite of the MFC YOLO v3/v4 training & inference tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5",
    "opencv-python>=4.5",
    "numpy>=1.23",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
yolo-tool = "yolo_tool_gui:main"

[tool.setuptools]
packages = ["yolo_tool"]
